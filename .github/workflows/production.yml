name: Production

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  deploy:
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    env:
      # The Vite plugin reads this while building. A later `--env production`
      # does not switch the database if the build already flattened the top-level config.
      CLOUDFLARE_ENV: production
    steps:
      - name: Keep production off until it is enabled
        id: gate
        run: |
          if [ "${{ vars.PRODUCTION_ENABLED }}" != "true" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Production is not enabled. This release does not deploy."
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: pnpm/action-setup@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          version: 10.34.4
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - if: steps.gate.outputs.enabled == 'true'
        working-directory: apps/web
        run: pnpm install --frozen-lockfile
      - if: steps.gate.outputs.enabled == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: "579692914a155ab268c22b814cbf8a05"
          workingDirectory: apps/web
          command: deploy --env production
